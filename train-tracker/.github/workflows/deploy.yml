name: Train Companion Full-Stack CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-node: '20'
          cache: 'npm'
          cache-dependency-path: 'train-tracker/backend/package-lock.json'

      - name: Install dependencies
        working-directory: train-tracker/backend
        run: npm ci

      - name: Compile TypeScript
        working-directory: train-tracker/backend
        run: npm run build

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'train-tracker/admin/package-lock.json'

      - name: Install dependencies
        working-directory: train-tracker/admin
        run: npm ci

      - name: Compile and Bundle Admin panel
        working-directory: train-tracker/admin
        run: npm run build
